# Called by cargo-dist after the GitHub release is announced.
name: Release web app
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: tar -czf niles-web.tar.gz -C dist .
      - run: gh release upload "$RELEASE_TAG" niles-web.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
