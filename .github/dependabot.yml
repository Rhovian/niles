version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # cargo-dist owns the generated release workflow.
    exclude-paths: [".github/workflows/release.yml"]
    # Toolchain refs include the deliberate MSRV pin.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    # web-push 0.11 accepts an isahc 1.x client.
    ignore:
      - dependency-name: isahc
        update-types: ["version-update:semver-major"]
