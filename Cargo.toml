[package]
name = "niles"
version = "1.8.0"
edition = "2024"
rust-version = "1.89"
description = "Coordinate coding agents from different model families in tmux."
readme = "README.md"
keywords = ["ai", "agents", "tmux", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rhovian/niles"
homepage = "https://github.com/Rhovian/niles"
exclude = [".github/**", "web/**"]

[features]
default = []
remote = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:tower"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
disallowed_methods = "deny"

[dependencies]
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", optional = true, default-features = false }
tower = { version = "0.5", optional = true, default-features = false, features = ["util"] }
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1"
uuid = { version = "1", features = ["v4"] }
ratatui-themes = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
