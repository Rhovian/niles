[package]
name = "niles"
version = "1.6.0"
edition = "2024"
rust-version = "1.89"
description = "Coordinate coding agents from different model families in tmux."
readme = "README.md"
keywords = ["ai", "agents", "tmux", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rhovian/niles"
exclude = [".github/**"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
disallowed_methods = "deny"

[dependencies]
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1"
uuid = { version = "1", features = ["v4"] }
ratatui-themes = "0.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
