# Codex reports a separate effort ladder for each model. Keeping those ladders per model avoids
# accepting a level that the installed CLI rejects.
codex:
  gpt-5.5:
    efforts: [low, medium, high, xhigh]
  gpt-5.6-luna:
    efforts: [low, medium, high, xhigh, max]
  gpt-5.6-sol:
    efforts: [low, medium, high, xhigh, max, ultra]
  gpt-5.6-terra:
    efforts: [low, medium, high, xhigh, max, ultra]
  gpt-6-astra:
    efforts: [low, medium, high, xhigh, max, ultra]
  gpt-6-luna:
    efforts: [low, medium, high, xhigh, max]
  gpt-6-sol:
    efforts: [low, medium, high, xhigh, max, ultra]
  gpt-6.1-sol:
    efforts: [low, medium, high, xhigh, max, ultra]

# Claude gates effort levels on model capabilities. Haiku has no effort capability, so its empty
# ladder means Niles does not pass an effort flag for it.
# Each alias's window is that of the model Anthropic's API resolves it to:
# https://code.claude.com/docs/en/model-config and
# https://platform.claude.com/docs/en/build-with-claude/context-windows
claude:
  fable:
    efforts: [low, medium, high, xhigh, max]
    context_window: 1000000
  haiku:
    efforts: []
  opus:
    efforts: [low, medium, high, xhigh, max]
    context_window: 1000000
  sonnet:
    efforts: [low, medium, high, xhigh, max]
    context_window: 1000000

# Hermes routes to provider models, but --reasoning has one vocabulary for all of them.
hermes:
  deepseek/deepseek-v4.1-flash:
    efforts: [none, minimal, low, medium, high, xhigh, max, ultra]
  tencent/hy3:
    efforts: [none, minimal, low, medium, high, xhigh, max, ultra]
  z-ai/glm-5.3-flash:
    efforts: [none, minimal, low, medium, high, xhigh, max, ultra]

# Pi's --thinking vocabulary is model-independent.
pi:
  deepseek/deepseek-v4.1-flash:
    efforts: [off, minimal, low, medium, high, xhigh]
  tencent/hy3:
    efforts: [off, minimal, low, medium, high, xhigh]
  z-ai/glm-5.3-flash:
    efforts: [off, minimal, low, medium, high, xhigh]
